font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 16.0
# background #0f1b22
# foreground #c3c6c7
background_opacity 0.8

initial_window_width 95c
initial_window_height 35c
window_padding_width 20

enable_image_protocol yes

# Normal colors
# color0 #0f1b22
# color1 #2F4A5D
# color2 #524D5F
# color3 #960A1B
# color4 #DA061A
# color5 #FB000F
# color6 #CD3255
# color7 #c3c6c7

# Bright colors
# color8 #5e6a73
# color9 #2F4A5D
# color10 #524D5F
# color11 #960A1B
# color12 #DA061A
# color13 #FB000F
# color14 #CD3255
# color15 #c3c6c7


# BEGIN_KITTY_THEME
# Tokyo Night
include ~/.cache/wal/colors-kitty.conf
# END_KITTY_THEME
